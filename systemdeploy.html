		.overlay-prompt {

		@keyframes pulse-prompt {

		.gold { color: #c9a227 !important; }

		.typing-area {
			background: #1a1a1a;
			border: 1px solid #333;
			border-top: none;
			border-radius: 0 0 var(--radius-lg) var(--radius-lg);

		.tower-option.matching {

		.type-input-wrapper {
			display: flex;

			gap: 8px;
			background: #111;

	<script>
	(function() {
		'use strict';

		// ===== CONSTANTS =====
		var W = 700, H = 500;
		var PATH_W = 28;

		var TOWER_DEFS = [
			{ word: 'firewall', name: 'Firewall',      range: 100, damage: 12, cooldown: 1.0, color: '#e85d3a', letter: 'F', slow: 0 },
			{ word: 'balancer', name: 'Load Balancer',  range: 100, damage: 4,  cooldown: 1.5, color: '#4a7aff', letter: 'B', slow: 0.4 },
			{ word: 'cache',    name: 'Cache',          range: 70,  damage: 8,  cooldown: 1.0, color: '#2ecc71', letter: 'C', slow: 0 },
			{ word: 'limiter',  name: 'Rate Limiter',   range: 100, damage: 2,  cooldown: 2.0, color: '#9b59b6', letter: 'L', slow: 0.6 },
			{ word: 'cdn',      name: 'CDN',            range: 150, damage: 4,  cooldown: 1.0, color: '#f39c12', letter: 'N', slow: 0 },
			{ word: 'database', name: 'Database',       range: 70,  damage: 20, cooldown: 2.0, color: '#1abc9c', letter: 'D', slow: 0 },
		];

		var ENEMY_DEFS = {
			request: { name: 'HTTP Request',  hp: 30,  speed: 90,  damage: 10, color: '#4a90d9', shape: 'circle',   size: 8 },
			spike:   { name: 'Traffic Spike',  hp: 50,  speed: 150, damage: 15, color: '#e74c3c', shape: 'triangle', size: 9 },
			bug:     { name: 'Bug',            hp: 120, speed: 48,  damage: 25, color: '#8e44ad', shape: 'hexagon',  size: 9 },
			ddos:    { name: 'DDoS',           hp: 15,  speed: 120, damage: 8,  color: '#e67e22', shape: 'diamond',  size: 6 },
		};

		var PATH_PTS = [
			{ x: -20, y: 80 },
			{ x: 540, y: 80 },
			{ x: 540, y: 200 },
			{ x: 160, y: 200 },
			{ x: 160, y: 320 },
			{ x: 540, y: 320 },
			{ x: 540, y: 440 },
			{ x: 670, y: 440 },
		];

		var SLOT_POS = [
			{ x: 130, y: 38 },
			{ x: 300, y: 38 },
			{ x: 460, y: 38 },
			{ x: 585, y: 140 },
			{ x: 380, y: 140 },
			{ x: 240, y: 140 },
			{ x: 115, y: 260 },
			{ x: 350, y: 260 },
			{ x: 480, y: 260 },
			{ x: 250, y: 368 },
			{ x: 400, y: 368 },
			{ x: 585, y: 380 },
		];

		function buildWaves() {
			return [
				genWave([{ type: 'request', count: 8, delay: 2.0 }]),
				genWave([{ type: 'request', count: 4, delay: 1.5 }, { type: 'spike', count: 3, delay: 2.0 }, { type: 'request', count: 2, delay: 1.5 }]),
				genWave([{ type: 'request', count: 3, delay: 1.5 }, { type: 'bug', count: 3, delay: 3.0 }, { type: 'request', count: 2, delay: 1.5 }]),
				genWave([{ type: 'request', count: 5, delay: 1.2 }, { type: 'spike', count: 4, delay: 1.5 }, { type: 'bug', count: 2, delay: 3.0 }, { type: 'request', count: 3, delay: 1.0 }]),
				genWave([{ type: 'ddos', count: 6, delay: 0.4 }, { type: 'request', count: 3, delay: 1.5 }, { type: 'ddos', count: 6, delay: 0.4 }, { type: 'spike', count: 2, delay: 1.5 }]),
				genWave([{ type: 'request', count: 4, delay: 1.0 }, { type: 'spike', count: 3, delay: 1.2 }, { type: 'bug', count: 3, delay: 2.5 }, { type: 'ddos', count: 8, delay: 0.3 }, { type: 'request', count: 4, delay: 0.8 }]),
				genWave([{ type: 'spike', count: 5, delay: 0.8 }, { type: 'bug', count: 4, delay: 2.0 }, { type: 'ddos', count: 10, delay: 0.25 }, { type: 'request', count: 8, delay: 0.6 }, { type: 'spike', count: 5, delay: 0.5 }, { type: 'bug', count: 3, delay: 1.5 }]),
			];
		}

		function genWave(groups) {
			var enemies = [];
			for (var g = 0; g < groups.length; g++) {
				for (var i = 0; i < groups[g].count; i++) {
					enemies.push({ type: groups[g].type, delay: groups[g].delay });
				}
			}
			if (enemies.length > 0) enemies[0].delay = 1.0;
			return enemies;
		}

		var WAVES = buildWaves();

		// ===== STATE =====
		var canvas, ctx;
		var state = 'menu';
		var health, score, waveIndex;
		var enemies = [], towers = [], slots = [], effects = [], surges = [];
		var spawnQueue = [], spawnTimer = 0;
		var correctWords, totalAttempts, totalCharsTyped;
		var nextEnemyId = 0;
		var gameStartTime;
		var lastTs = 0;
		var animPhase = 0;

		// DOM
		var overlay, inputEl, inputWrapper, towerOptions;
		var hudWave, hudHealth, hudWpm, hudAccuracy, hudScore;

		// ===== INIT =====
		function init() {
			canvas = document.getElementById('canvas');
			ctx = canvas.getContext('2d');
			overlay = document.getElementById('overlay');
			inputEl = document.getElementById('type-input');
			inputWrapper = document.getElementById('input-wrapper');
			towerOptions = document.querySelectorAll('.tower-option');

			hudWave = document.getElementById('hud-wave');
			hudHealth = document.getElementById('hud-health');
			hudWpm = document.getElementById('hud-wpm');
			hudAccuracy = document.getElementById('hud-accuracy');
			hudScore = document.getElementById('hud-score');

			// Auto-deploy when typed word matches a tower name
			inputEl.addEventListener('input', function() {
				updateHighlights();
				if (state === 'playing') {
					var val = inputEl.value.toLowerCase().trim();
					for (var i = 0; i < TOWER_DEFS.length; i++) {
						if (TOWER_DEFS[i].word === val) {
							handleSubmit();
							break;
						}
					}
				}
			});

			// Handle ALL keyboard input at window level so focus doesn't matter
			window.addEventListener('keydown', function(e) {
				if (e.key === 'Enter') {
					if (state === 'menu') { startGame(); e.preventDefault(); }
					else if (state === 'playing') { handleSubmit(); e.preventDefault(); }
					else if (state === 'waveComplete') { waveIndex++; startWave(); beginPlay(); e.preventDefault(); }
					else if (state === 'gameOver' || state === 'win') { startGame(); e.preventDefault(); }
				}
				// Auto-focus input during gameplay so typing always works
				if (state === 'playing' && document.activeElement !== inputEl) {
					inputEl.focus();
				}
			});

			// Click overlay to start/continue
			overlay.addEventListener('click', function() {
				if (state === 'menu') startGame();
				else if (state === 'waveComplete') { waveIndex++; startWave(); beginPlay(); }
				else if (state === 'gameOver' || state === 'win') startGame();
			});

			// Click game area to focus input
			document.querySelector('.game-canvas-area').addEventListener('click', function() {
				if (state === 'playing') inputEl.focus();
			});

			showMenu();
			requestAnimationFrame(gameLoop);
		}

		// ===== GAME LOOP =====
		function gameLoop(ts) {
			var dt = lastTs ? (ts - lastTs) / 1000 : 0;
			dt = Math.min(dt, 0.1);
			lastTs = ts;
			animPhase += dt * 3;

			if (state === 'playing') {
				update(dt);
			}

			draw();
			requestAnimationFrame(gameLoop);
		}

		function update(dt) {
			updateSpawner(dt);
			updateEnemies(dt);
			updateTowers(dt);
			updateSurges(dt);
			updateEffects(dt);
			updateHUD();

			if (health <= 0) {
				health = 0;
				updateHUD();
				showGameOver();
				return;
			}

			if (spawnQueue.length === 0 && enemies.length === 0 && surges.length === 0) {
				if (waveIndex >= WAVES.length - 1) {
					showWin();
				} else {
					showWaveComplete();
				}
			}
		}

		// ===== SPAWNER =====
		function updateSpawner(dt) {
			if (spawnQueue.length === 0) return;
			spawnTimer -= dt;
			while (spawnTimer <= 0 && spawnQueue.length > 0) {
				var entry = spawnQueue.shift();
				spawnEnemy(entry.type);
				if (spawnQueue.length > 0) {
					spawnTimer += spawnQueue[0].delay;
				} else {
					break;
				}
			}
		}

		function spawnEnemy(type) {
			var def = ENEMY_DEFS[type];
			var speedBoost = waveIndex > 1 ? 1 + (waveIndex - 1) * 0.12 : 1;
			enemies.push({
				id: nextEnemyId++,
				type: type,
				x: PATH_PTS[0].x,
				y: PATH_PTS[0].y,
				hp: def.hp,
				maxHp: def.hp,
				speed: def.speed * speedBoost,
				damage: def.damage,
				color: def.color,
				shape: def.shape,
				size: def.size,
				pathIdx: 1,
				speedMult: 1,
				slowTimer: 0,
				dead: false,
				deathTimer: 0,
			});
		}

		// ===== ENEMIES =====
		function updateEnemies(dt) {
			for (var i = enemies.length - 1; i >= 0; i--) {
				var e = enemies[i];

				if (e.dead) {
					e.deathTimer -= dt;
					if (e.deathTimer <= 0) enemies.splice(i, 1);
					continue;
				}

				if (e.slowTimer > 0) {
					e.slowTimer -= dt;
					if (e.slowTimer <= 0) { e.speedMult = 1; e.slowTimer = 0; }
				}

				var target = PATH_PTS[e.pathIdx];
				var dx = target.x - e.x;
				var dy = target.y - e.y;
				var d = Math.sqrt(dx * dx + dy * dy);
				var move = e.speed * e.speedMult * dt;

				if (move >= d) {
					e.x = target.x;
					e.y = target.y;
					e.pathIdx++;
					if (e.pathIdx >= PATH_PTS.length) {
						health -= e.damage;
						effects.push({ type: 'serverHit', timer: 0.4 });
						enemies.splice(i, 1);
					}
				} else {
					e.x += (dx / d) * move;
					e.y += (dy / d) * move;
				}
			}
		}

		// ===== TOWERS =====
		function updateTowers(dt) {
			for (var i = 0; i < towers.length; i++) {
				var t = towers[i];
				t.timer -= dt;
				if (t.timer <= 0) {
					var target = findTarget(t);
					if (target) {
						attackEnemy(t, target);
						t.timer = t.cooldown;
					} else {
						t.timer = 0.1;
					}
				}
			}
		}

		function findTarget(tower) {
			var closest = null;
			var closestDist = Infinity;
			for (var i = 0; i < enemies.length; i++) {
				var e = enemies[i];
				if (e.dead) continue;
				var d = getDist(tower.x, tower.y, e.x, e.y);
				if (d <= tower.range && d < closestDist) {
					closest = e;
					closestDist = d;
				}
			}
			return closest;
		}

		function attackEnemy(tower, target) {
			target.hp -= tower.damage;

			if (tower.slow > 0) {
				target.speedMult = 1 - tower.slow;
				target.slowTimer = 2.0;
			}

			effects.push({
				type: 'attack',
				x1: tower.x, y1: tower.y,
				x2: target.x, y2: target.y,
				color: tower.color,
				timer: 0.15,
			});

			if (target.hp <= 0) {
				target.dead = true;
				target.deathTimer = 0.3;
				score += 10;
				effects.push({ type: 'kill', x: target.x, y: target.y, color: target.color, timer: 0.4 });
			}
		}

		// ===== EFFECTS =====
		function updateEffects(dt) {
			for (var i = effects.length - 1; i >= 0; i--) {
				effects[i].timer -= dt;
				if (effects[i].timer <= 0) effects.splice(i, 1);
			}
		}

		// ===== TYPING =====
		function handleSubmit() {
			var val = inputEl.value.toLowerCase().trim();
			if (!val) return;

			totalAttempts++;

			var towerDef = null;
			for (var i = 0; i < TOWER_DEFS.length; i++) {
				if (TOWER_DEFS[i].word === val) { towerDef = TOWER_DEFS[i]; break; }
			}

			if (towerDef) {
				var slotIdx = -1;
				for (var j = 0; j < slots.length; j++) {
					if (!slots[j].occupied) { slotIdx = j; break; }
				}
				if (slotIdx !== -1) {
					placeTower(towerDef, slotIdx);
					correctWords++;
					totalCharsTyped += val.length;
					flashInput('correct');
				} else {
					// All slots full — try to upgrade an existing tower of this type
					var upgraded = upgradeTower(towerDef);
					correctWords++;
					totalCharsTyped += val.length;
					if (upgraded) {
						flashInput('correct');
					} else {
						// All towers of this type are maxed — launch surge projectile
						launchSurge(towerDef);
						flashInput('correct');
					}
				}
			} else {
				flashInput('wrong');
			}

			inputEl.value = '';
			updateHighlights();
		}

		function placeTower(def, slotIdx) {
			var slot = slots[slotIdx];
			slot.occupied = true;
			towers.push({
				x: slot.x,
				y: slot.y,
				range: def.range,
				damage: def.damage,
				baseDamage: def.damage,
				baseRange: def.range,
				cooldown: def.cooldown,
				timer: 0.5,
				color: def.color,
				letter: def.letter,
				name: def.name,
				word: def.word,
				slow: def.slow,
				level: 1,
			});
			score += 25;
		}

		function upgradeTower(def) {
			// Find the lowest-level tower of this type to upgrade (max level 3)
			var target = null;
			for (var i = 0; i < towers.length; i++) {
				if (towers[i].word === def.word && towers[i].level < 3) {
					if (!target || towers[i].level < target.level) {
						target = towers[i];
					}
				}
			}
			if (!target) return false;
			target.level++;
			target.damage = Math.round(target.baseDamage * (1 + (target.level - 1) * 0.5));
			target.range = Math.round(target.baseRange * (1 + (target.level - 1) * 0.15));
			score += 50;
			effects.push({ type: 'upgrade', x: target.x, y: target.y, timer: 0.5 });
			return true;
		}

		function launchSurge(def) {
			surges.push({
				x: PATH_PTS[0].x,
				y: PATH_PTS[0].y,
				pathIdx: 1,
				speed: 250,
				damage: Math.round(def.damage * 4),
				radius: 35,
				color: def.color,
				letter: def.letter,
				hitSet: {},
				trail: [],
			});
			score += 30;
		}

		function updateSurges(dt) {
			for (var i = surges.length - 1; i >= 0; i--) {
				var s = surges[i];

				// Move along path
				var target = PATH_PTS[s.pathIdx];
				var dx = target.x - s.x;
				var dy = target.y - s.y;
				var d = Math.sqrt(dx * dx + dy * dy);
				var move = s.speed * dt;

				if (move >= d) {
					s.x = target.x;
					s.y = target.y;
					s.pathIdx++;
					if (s.pathIdx >= PATH_PTS.length) {
						surges.splice(i, 1);
						continue;
					}
				} else {
					s.x += (dx / d) * move;
					s.y += (dy / d) * move;
				}

				// Add trail point
				s.trail.push({ x: s.x, y: s.y, alpha: 1 });
				if (s.trail.length > 12) s.trail.shift();

				// Damage nearby enemies
				for (var j = 0; j < enemies.length; j++) {
					var e = enemies[j];
					if (e.dead) continue;
					if (s.hitSet[e.id]) continue;
					var ed = getDist(s.x, s.y, e.x, e.y);
					if (ed <= s.radius) {
						e.hp -= s.damage;
						s.hitSet[e.id] = true;
						effects.push({ type: 'attack', x1: s.x, y1: s.y, x2: e.x, y2: e.y, color: s.color, timer: 0.15 });
						if (e.hp <= 0) {
							e.dead = true;
							e.deathTimer = 0.3;
							score += 10;
							effects.push({ type: 'kill', x: e.x, y: e.y, color: e.color, timer: 0.4 });
						}
					}
				}
			}
		}

		function drawSurges() {
			for (var i = 0; i < surges.length; i++) {
				var s = surges[i];

				// Trail
				for (var j = 0; j < s.trail.length; j++) {
					var t = s.trail[j];
					var ta = (j + 1) / s.trail.length * 0.4;
					ctx.fillStyle = s.color;
					ctx.globalAlpha = ta;
					ctx.beginPath();
					ctx.arc(t.x, t.y, 4 + (j / s.trail.length) * 4, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.globalAlpha = 1;

				// Glow
				ctx.fillStyle = s.color + '30';
				ctx.beginPath();
				ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
				ctx.fill();

				// Core
				ctx.fillStyle = s.color;
				ctx.beginPath();
				ctx.arc(s.x, s.y, 8, 0, Math.PI * 2);
				ctx.fill();

				// White center
				ctx.fillStyle = '#fff';
				ctx.beginPath();
				ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
				ctx.fill();

				// Letter
				ctx.fillStyle = '#fff';
				ctx.font = 'bold 8px sans-serif';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText(s.letter, s.x, s.y - 14);
			}
		}

		function flashInput(type) {
			inputWrapper.classList.remove('flash-correct', 'flash-wrong', 'flash-full');
			void inputWrapper.offsetWidth;
			inputWrapper.classList.add('flash-' + type);
			setTimeout(function() {
				inputWrapper.classList.remove('flash-correct', 'flash-wrong', 'flash-full');
			}, 300);
		}

		function updateHighlights() {
			var val = inputEl.value.toLowerCase();
			for (var i = 0; i < towerOptions.length; i++) {
				var word = towerOptions[i].dataset.word;
				if (val.length > 0 && word.indexOf(val) === 0) {
					towerOptions[i].classList.add('matching');
				} else {
					towerOptions[i].classList.remove('matching');
				}
			}
		}

		function getWPM() {
			var elapsed = (performance.now() - gameStartTime) / 60000;
			if (elapsed < 0.01) return 0;
			return Math.round((totalCharsTyped / 5) / elapsed);
		}

		function getAccuracy() {
			if (totalAttempts === 0) return 100;
			return Math.round((correctWords / totalAttempts) * 100);
		}

		function calcScore() {
			var wpm = getWPM();
			var acc = getAccuracy();
			var waveBonus = (waveIndex + (state === 'win' ? 1 : 0)) * 100;
			return Math.round(wpm * 10 + acc * 5 + health * 3 + waveBonus + score);
		}

		// ===== HUD =====
		function updateHUD() {
			hudWave.textContent = 'Wave ' + (waveIndex + 1) + '/' + WAVES.length;
			hudHealth.textContent = 'HP: ' + health;
			hudHealth.className = health <= 30 ? 'hud-item urgent' : 'hud-item';
			hudWpm.textContent = 'WPM: ' + getWPM();
			hudAccuracy.textContent = getAccuracy() + '%';
			hudScore.textContent = 'Score: ' + calcScore();
		}

		// ===== DRAWING =====
		function draw() {
			ctx.fillStyle = '#1a1a1a';
			ctx.fillRect(0, 0, W, H);

			drawGrid();
			drawPath();
			drawSlots();
			drawTowers();
			drawEnemies();
			drawSurges();
			drawEffects();
			drawServer();
		}

		function drawGrid() {
			ctx.strokeStyle = '#222';
			ctx.lineWidth = 0.5;
			for (var x = 0; x < W; x += 40) {
				ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
			}
			for (var y = 0; y < H; y += 40) {
				ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
			}
		}

		function drawPath() {
			ctx.strokeStyle = '#2a2a2a';
			ctx.lineWidth = PATH_W + 4;
			ctx.lineCap = 'round';
			ctx.lineJoin = 'round';
			ctx.beginPath();
			ctx.moveTo(PATH_PTS[0].x, PATH_PTS[0].y);
			for (var i = 1; i < PATH_PTS.length; i++) ctx.lineTo(PATH_PTS[i].x, PATH_PTS[i].y);
			ctx.stroke();

			ctx.strokeStyle = '#333';
			ctx.lineWidth = PATH_W;
			ctx.beginPath();
			ctx.moveTo(PATH_PTS[0].x, PATH_PTS[0].y);
			for (var j = 1; j < PATH_PTS.length; j++) ctx.lineTo(PATH_PTS[j].x, PATH_PTS[j].y);
			ctx.stroke();
		}

		function drawSlots() {
			for (var i = 0; i < slots.length; i++) {
				if (slots[i].occupied) continue;
				var s = slots[i];
				ctx.strokeStyle = '#444';
				ctx.lineWidth = 1;
				ctx.setLineDash([4, 4]);
				ctx.beginPath();
				ctx.arc(s.x, s.y, 14, 0, Math.PI * 2);
				ctx.stroke();
				ctx.setLineDash([]);

				ctx.fillStyle = '#444';
				ctx.font = '9px sans-serif';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText(String(i + 1), s.x, s.y);
			}
		}

		function drawTowers() {
			for (var i = 0; i < towers.length; i++) {
				var t = towers[i];

				// Range ring
				ctx.strokeStyle = t.color + '15';
				ctx.lineWidth = 1;
				ctx.beginPath();
				ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
				ctx.stroke();

				// Tower body
				ctx.fillStyle = t.color;
				ctx.beginPath();
				ctx.arc(t.x, t.y, 14, 0, Math.PI * 2);
				ctx.fill();

				// Border
				ctx.strokeStyle = 'rgba(255,255,255,0.2)';
				ctx.lineWidth = 1.5;
				ctx.beginPath();
				ctx.arc(t.x, t.y, 14, 0, Math.PI * 2);
				ctx.stroke();

				// Upgrade rings (one per level above 1)
				for (var lvl = 1; lvl < t.level; lvl++) {
					ctx.strokeStyle = '#c9a227';
					ctx.lineWidth = 1.5;
					ctx.beginPath();
					ctx.arc(t.x, t.y, 14 + lvl * 4, 0, Math.PI * 2);
					ctx.stroke();
				}

				// Letter
				ctx.fillStyle = '#fff';
				ctx.font = 'bold 11px sans-serif';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText(t.letter, t.x, t.y);

				// Level indicator
				if (t.level > 1) {
					ctx.fillStyle = '#c9a227';
					ctx.font = 'bold 8px sans-serif';
					ctx.fillText('Lv' + t.level, t.x, t.y + 20);
				}
			}
		}

		function drawEnemies() {
			for (var i = 0; i < enemies.length; i++) {
				var e = enemies[i];
				ctx.save();
				ctx.translate(e.x, e.y);

				var alpha = e.dead ? Math.max(0, e.deathTimer / 0.3) : 1;
				ctx.globalAlpha = alpha;

				var sc = e.dead ? 0.5 + 0.5 * (e.deathTimer / 0.3) : 1;
				ctx.scale(sc, sc);

				ctx.fillStyle = e.color;

				if (e.shape === 'circle') {
					ctx.beginPath();
					ctx.arc(0, 0, e.size, 0, Math.PI * 2);
					ctx.fill();
				} else if (e.shape === 'triangle') {
					ctx.beginPath();
					ctx.moveTo(e.size, 0);
					ctx.lineTo(-e.size * 0.7, -e.size * 0.8);
					ctx.lineTo(-e.size * 0.7, e.size * 0.8);
					ctx.closePath();
					ctx.fill();
				} else if (e.shape === 'hexagon') {
					ctx.beginPath();
					for (var h = 0; h < 6; h++) {
						var angle = Math.PI / 3 * h - Math.PI / 6;
						var hx = Math.cos(angle) * e.size;
						var hy = Math.sin(angle) * e.size;
						if (h === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
					}
					ctx.closePath();
					ctx.fill();
				} else if (e.shape === 'diamond') {
					ctx.beginPath();
					ctx.moveTo(0, -e.size);
					ctx.lineTo(e.size, 0);
					ctx.lineTo(0, e.size);
					ctx.lineTo(-e.size, 0);
					ctx.closePath();
					ctx.fill();
				}

				if (!e.dead && e.hp < e.maxHp) {
					ctx.scale(1 / sc, 1 / sc);
					ctx.globalAlpha = 1;
					var pct = e.hp / e.maxHp;
					var bw = 16;
					ctx.fillStyle = '#333';
					ctx.fillRect(-bw / 2, -e.size - 8, bw, 3);
					ctx.fillStyle = pct > 0.5 ? '#2ecc71' : pct > 0.25 ? '#f39c12' : '#e74c3c';
					ctx.fillRect(-bw / 2, -e.size - 8, bw * pct, 3);
				}

				if (!e.dead && e.slowTimer > 0) {
					ctx.globalAlpha = 0.5;
					ctx.strokeStyle = '#9b59b6';
					ctx.lineWidth = 1.5;
					ctx.beginPath();
					ctx.arc(0, 0, e.size + 3, 0, Math.PI * 2);
					ctx.stroke();
				}

				ctx.restore();
			}
		}

		function drawEffects() {
			for (var i = 0; i < effects.length; i++) {
				var fx = effects[i];
				if (fx.type === 'attack') {
					ctx.save();
					ctx.globalAlpha = fx.timer / 0.15;
					ctx.strokeStyle = fx.color;
					ctx.lineWidth = 2;
					ctx.beginPath();
					ctx.moveTo(fx.x1, fx.y1);
					ctx.lineTo(fx.x2, fx.y2);
					ctx.stroke();
					ctx.restore();
				} else if (fx.type === 'serverHit') {
					ctx.save();
					var sa = fx.timer / 0.4;
					ctx.fillStyle = 'rgba(231, 76, 60, ' + (sa * 0.3) + ')';
					var sx = PATH_PTS[PATH_PTS.length - 1].x;
					var sy = PATH_PTS[PATH_PTS.length - 1].y;
					ctx.beginPath();
					ctx.arc(sx, sy, 30, 0, Math.PI * 2);
					ctx.fill();
					ctx.restore();
				} else if (fx.type === 'kill') {
					ctx.save();
					var ka = fx.timer / 0.4;
					var kr = 12 * (1 - ka) + 4;
					ctx.globalAlpha = ka;
					ctx.strokeStyle = fx.color;
					ctx.lineWidth = 1.5;
					ctx.beginPath();
					ctx.arc(fx.x, fx.y, kr, 0, Math.PI * 2);
					ctx.stroke();
					ctx.restore();
				} else if (fx.type === 'upgrade') {
					ctx.save();
					var ua = fx.timer / 0.5;
					var ur = 20 * (1 - ua) + 14;
					ctx.globalAlpha = ua;
					ctx.strokeStyle = '#c9a227';
					ctx.lineWidth = 2;
					ctx.beginPath();
					ctx.arc(fx.x, fx.y, ur, 0, Math.PI * 2);
					ctx.stroke();
					ctx.fillStyle = '#c9a227';
					ctx.font = 'bold 10px sans-serif';
					ctx.textAlign = 'center';
					ctx.fillText('UPGRADED', fx.x, fx.y - 24);
					ctx.restore();
				}
			}
		}

		function drawServer() {
			var sx = PATH_PTS[PATH_PTS.length - 1].x;
			var sy = PATH_PTS[PATH_PTS.length - 1].y;

			var pulse = 0.2 + 0.1 * Math.sin(animPhase);
			ctx.fillStyle = 'rgba(201, 162, 39, ' + pulse + ')';
			ctx.beginPath();
			ctx.arc(sx, sy, 22, 0, Math.PI * 2);
			ctx.fill();

			var bw = 24, bh = 32;
			ctx.fillStyle = '#c9a227';
			ctx.fillRect(sx - bw / 2, sy - bh / 2, bw, bh);

			ctx.fillStyle = '#1a1a1a';
			for (var i = 0; i < 3; i++) {
				ctx.fillRect(sx - bw / 2 + 4, sy - bh / 2 + 6 + i * 10, bw - 8, 2);
			}

			ctx.fillStyle = '#c9a227';
			ctx.font = '9px sans-serif';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'top';
			ctx.fillText('SERVER', sx, sy + bh / 2 + 4);
		}

		// ===== STATE TRANSITIONS =====
		function startGame() {
			health = 100;
			score = 0;
			waveIndex = 0;
			nextEnemyId = 0;
			enemies = [];
			towers = [];
			effects = [];
			surges = [];
			slots = [];
			for (var i = 0; i < SLOT_POS.length; i++) {
				slots.push({ x: SLOT_POS[i].x, y: SLOT_POS[i].y, occupied: false });
			}
			correctWords = 0;
			totalAttempts = 0;
			totalCharsTyped = 0;
			gameStartTime = performance.now();
			WAVES = buildWaves();
			startWave();
			beginPlay();
		}

		function startWave() {
			spawnQueue = [];
			for (var i = 0; i < WAVES[waveIndex].length; i++) {
				spawnQueue.push({ type: WAVES[waveIndex][i].type, delay: WAVES[waveIndex][i].delay });
			}
			spawnTimer = spawnQueue.length > 0 ? spawnQueue[0].delay : 0;
		}

		function beginPlay() {
			state = 'playing';
			overlay.classList.add('hidden');
			inputEl.disabled = false;
			inputEl.value = '';
			inputEl.focus();
			// Retry focus with delays in case browser blocks immediate focus
			setTimeout(function() { inputEl.focus(); }, 50);
			setTimeout(function() { inputEl.focus(); }, 200);
			updateHighlights();
		}

		function showMenu() {
			state = 'menu';
			overlay.classList.remove('hidden');
			overlay.innerHTML =
				'<h2 class="overlay-title">SYSTEM DEPLOY</h2>' +
				'<p class="overlay-sub">Tower Defense &times; Typing Speed</p>' +
				'<div class="overlay-desc">' +
					'Type component names to deploy defenses<br>and protect your server from incoming threats.' +
				'</div>' +
				'<div class="overlay-towers">' +
					'<span style="color:#e85d3a">firewall</span> &middot; ' +
					'<span style="color:#4a7aff">balancer</span> &middot; ' +
					'<span style="color:#2ecc71">cache</span><br>' +
					'<span style="color:#9b59b6">limiter</span> &middot; ' +
					'<span style="color:#f39c12">cdn</span> &middot; ' +
					'<span style="color:#1abc9c">database</span>' +
				'</div>' +
				'<p class="overlay-prompt">Click or Press Enter to Start</p>';
			inputEl.disabled = true;
		}

		function showWaveComplete() {
			state = 'waveComplete';
			overlay.classList.remove('hidden');
			overlay.innerHTML =
				'<h2 class="overlay-title gold">WAVE ' + (waveIndex + 1) + ' COMPLETE</h2>' +
				'<div class="overlay-stats">' +
					'HP: ' + health + ' &middot; WPM: ' + getWPM() + ' &middot; Accuracy: ' + getAccuracy() + '%' +
				'</div>' +
				'<p class="overlay-prompt">Press Enter for Wave ' + (waveIndex + 2) + '</p>';
			inputEl.disabled = true;
		}

		function showGameOver() {
			state = 'gameOver';
			overlay.classList.remove('hidden');
			overlay.innerHTML =
				'<h2 class="overlay-title" style="color:#e74c3c">SYSTEM DOWN</h2>' +
				'<p class="overlay-sub">Your server was overwhelmed</p>' +
				'<div class="overlay-stats">' +
					'Waves: ' + (waveIndex + 1) + '/' + WAVES.length + '<br>' +
					'WPM: ' + getWPM() + ' &middot; Accuracy: ' + getAccuracy() + '%<br>' +
					'<span style="font-size:1.3rem">Score: ' + calcScore() + '</span>' +
				'</div>' +
				'<p class="overlay-prompt">Press Enter to Retry</p>';
			inputEl.disabled = true;
		}

		function showWin() {
			state = 'win';
			overlay.classList.remove('hidden');
			overlay.innerHTML =
				'<h2 class="overlay-title gold">SYSTEM SECURED</h2>' +
				'<p class="overlay-sub">All waves defended successfully!</p>' +
				'<div class="overlay-stats">' +
					'Health: ' + health + '/100<br>' +
					'WPM: ' + getWPM() + ' &middot; Accuracy: ' + getAccuracy() + '%<br>' +
					'<span class="gold" style="font-size:1.5rem">Score: ' + calcScore() + '</span>' +
				'</div>' +
				'<p class="overlay-prompt">Press Enter to Play Again</p>';
			inputEl.disabled = true;
		}

		// ===== UTILS =====
		function getDist(x1, y1, x2, y2) {
			var dx = x1 - x2, dy = y1 - y2;
			return Math.sqrt(dx * dx + dy * dy);
		}

		// ===== START =====
		document.addEventListener('DOMContentLoaded', init);
	})();
	</script>
